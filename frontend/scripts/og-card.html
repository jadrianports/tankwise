<!doctype html>
<!--
  Committed source of truth for the social preview card (LNCH-04, D-11,
  D-12). frontend/public/og-card.png is GENERATED from this file by
  og-card.capture.ts and must never be hand-edited -- edit this template
  and regenerate instead:

    npm run capture --prefix frontend -- og-card

  Standalone and dependency-free on purpose: no build step, no bundler, no
  CDN request. The map backdrop, the wordmark, and both webfonts are all
  referenced by relative filesystem path, so this file renders identically
  whether it's opened directly in a browser (double-click, for a design
  check) or loaded via a file:// URL by the Playwright capture spec.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TankWise OG card source</title>
    <style>
      /*
        Fonts are loaded straight from the app's own installed
        @fontsource packages on disk (frontend/node_modules), not a CDN
        request -- the same Space Grotesk / Inter pairing theme.js uses,
        at the same two weights the type scale actually ships (400, 600;
        see theme.js's own "no 700 weight" comment). A card rendered in a
        fallback system font would be invisible-until-published off-brand,
        so this path is load-bearing, not cosmetic. If this relative path
        ever proves brittle (e.g. the capture script moves), the fallback
        is a Google Fonts <link> -- not used here because the local files
        already exist and are verified present in node_modules.
      */
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 600;
        src: url('../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-600-normal.woff2') format('woff2'),
          url('../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-600-normal.woff') format('woff');
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'),
          url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff') format('woff');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        background: #10151b;
      }

      /*
        Exactly one 1200x630 card. Explicit width/height plus
        overflow:hidden keep the rendered PNG at exactly the Open Graph
        spec size with no scrollbar artifact and no sub-pixel edge --
        og-card.capture.ts screenshots this element directly, not the
        viewport, so this box IS the output's intrinsic pixel size.
      */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
      }

      /*
        The real Mapbox GL route screenshot (docs/screenshots/hero-light.png
        from plan 15-05), used as a full-bleed backdrop. hero-light.png is
        a 1280x720 full-app screenshot: a green (pre-rebrand-titled) header
        + toolbar row (source y 0-124) and a form sidebar (source x 0-424)
        alongside the actual routed map (source x 424-1280, y 124-720).
        These fixed pixel values scale and position the image so only that
        map region fills the card -- keeping the stale header text and the
        form sidebar entirely out of frame -- and center the vertical crop
        within the map region so it favors the route's midpoint over the
        map's own floating UI controls (which sit just above this crop's
        start). The map is what makes this read as a product, not a repo
        link, so it gets the whole frame.
      */
      .card__backdrop {
        position: absolute;
        inset: 0;
        background-image: url('../../docs/screenshots/hero-light.png');
        background-repeat: no-repeat;
        background-size: 1795px auto;
        background-position: -594px -277px;
      }

      /*
        Legibility scrim: a directional gradient in the product's own
        primary-dark green (theme.js light.palette.primary.dark,
        #0A4F39 -> rgb(10,79,57)), strong over the text column on the left
        and fading out toward the visible map on the right. Text placed
        directly on a map screenshot of unpredictable brightness is
        unreadable at link-preview size -- this is why the scrim exists.
      */
      .card__scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          rgba(10, 79, 57, 0.96) 0%,
          rgba(10, 79, 57, 0.9) 36%,
          rgba(10, 21, 17, 0.6) 58%,
          rgba(10, 21, 17, 0.12) 82%
        );
      }

      .card__content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-left: 72px;
        width: 1020px;
      }

      .card__brand {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      /* The existing favicon.svg brand mark, locked up beside the wordmark. */
      .card__mark {
        width: 60px;
        height: 58px;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.35));
      }

      .card__wordmark {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 66px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }

      /*
        Feature-forward tagline (D-13): name-checks the three headline v3
        features (multi-stop, EIA-indexed prices, elevation) in one line
        that does not wrap at this width/size, per D-11's requirement.
      */
      .card__tagline {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 27px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.94);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card__backdrop"></div>
      <div class="card__scrim"></div>
      <div class="card__content">
        <div class="card__brand">
          <img class="card__mark" src="../public/favicon.svg" alt="" />
          <span class="card__wordmark">TankWise</span>
        </div>
        <p class="card__tagline">Multi-stop routing, EIA-indexed prices, elevation-aware planning.</p>
      </div>
    </div>
  </body>
</html>
